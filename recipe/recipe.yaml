schema_version: 1

context:
  name: hatch-cpp
  version: "0.5.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/hatch_cpp-${{ version }}.tar.gz
  sha256: 6c56d03446dd2ccc32db76c2c313a27edac13c5019c40ca57a999161cb8dee5a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.20
  run:
    - python >=${{ python_min }}
    - hatchling >=1.20
    - hatch-build >=0.5,<0.6
    - pydantic

tests:
  - python:
      imports:
        - hatch_cpp
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Hatch plugin for C++ builds
  description: Hatch plugin for C++ builds
  homepage: https://github.com/python-project-templates/hatch-cpp
  repository: https://github.com/python-project-templates/hatch-cpp

extra:
  recipe-maintainers:
    - timkpaine
